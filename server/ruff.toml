# Ruff configuration for DraftPeek server/ (see 协作同步服务设计评估报告_v1.0.30.md P0-1)
# Scope is deliberately narrow: catch real errors (F = pyflakes) and import
# hygiene (I = isort). Style-only / framework-false-positive rules are excluded
# so the CI lint gate stays meaningful and green for reference-quality code.

line-length = 120
target-version = "py312"

[lint]
select = ["F", "E", "I"]
# E501 (line-too-long) tolerated: reference code prioritizes readability.
ignore = ["E501"]

[lint.isort]
known-first-party = ["sync_server"]
