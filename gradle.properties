org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
android.suppressUnsupportedCompileSdk=36
kotlin.compiler.execution.strategy=in-process

# Compose Compiler metrics — generates reports for recomposition analysis
# Run: ./gradlew assembleDebug — then check build/compose-metrics/ and build/compose-reports/
compose.compiler.metrics.destination=build/compose-metrics
compose.compiler.reports.destination=build/compose-reports

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AI Protection switch (§9 rollback): set to false to disable all AI detection/response
draftpeek.aiProtection.enabled=true

# B-layer string encryption IR plugin (default off for stability)
draftpeek.stringEnc.enabled=false
