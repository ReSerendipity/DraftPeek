org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
android.suppressUnsupportedCompileSdk=36
kotlin.compiler.execution.strategy=in-process

# Compose Compiler metrics — generates reports for recomposition analysis
# Run: ./gradlew assembleDebug — then check build/compose-metrics/ and build/compose-reports/
compose.compiler.metrics.destination=build/compose-metrics
compose.compiler.reports.destination=build/compose-reports

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ===== Version Management =====
# Centralized version definition — update here, no need to edit build.gradle.kts.
# Use: ./gradlew bumpVersion -Pbump=major|minor|patch (auto-increments)
draftpeek.version.major=1
draftpeek.version.minor=0
draftpeek.version.patch=30

# AI Protection switch (§9 rollback): set to false to disable all AI detection/response
draftpeek.aiProtection.enabled=true

# R1 (2026-09-04): 远程安全策略 Ed25519 验签公钥（X.509 DER base64）。
# 公钥非机密、可入库；对应私钥仅策略服务器持有（本机 %TEMP% 副本移交后须删除）。
# 为空 → RemotePolicyManager fail-closed（忽略全部远程策略）。
policyEd25519PublicKey=MCowBQYDK2VwAyEAItsLeBr5gHwkBcYlp/vptL8aV//oZno0u10a22vLwjc=

# B-layer string encryption IR plugin
# R8 (2026-09-04): 计划未实现 —— StringEncIrGenerationExtension 从未被注册（死代码），
# Transformer 为占位 no-op（加密结果被丢弃），SecureStringResolver 无任何调用方。
# 此开关实际读取方用的是 System.getProperty 而非 gradle property，原本也未生效。
# 关闭以与真实能力一致；启用前必须完成：注册扩展 + AES-256-CBC 实装 +
# 构建期注入 KEY_FRAGMENT_3（BUILD_PERIOD_REPLACE）并保证与 IR 插件分片一致。
draftpeek.stringEnc.enabled=false

# R1: 远程策略 Ed25519 公钥（X.509 DER base64，公开无损）。
# 对应私钥由服务端签名使用，绝不进仓库；私钥当前位于本地临时文件，
# 部署时须迁移至签名服务端密钥库后删除本地副本。
policyEd25519PublicKey=MCowBQYDK2VwAyEAItsLeBr5gHwkBcYlp/vptL8aV//oZno0u10a22vLwjc=
