# Composite action：instrumented 测试单次尝试（恢复 KVM 权限 → 清理残留 → 启动模拟器 → connected 测试）。
#
# 背景（2026-09-15）：GH runner 镜像 20260828.587 起，/dev/kvm 对 runner 用户失去默认访问权限，
# android-emulator-runner 的 ProbeKVM 探测失败后自动切软件模拟（disable-linux-hw-accel=auto），
# 造成模拟器软启动 ~8 分钟后在第一条 adb shell settings 上崩溃（Broken pipe）。
# 实测证据：PR #22 上四个尝试（旧工作流 ×3 + 重试工作流 ×1）全部同型失败。
# 修复：kvm4all udev 规则（AOSP 社区标准做法）恢复 /dev/kvm 访问权限，恢复硬件加速。
# 本文件由 #41 建立（重试框架），#42 在此之上加入 KVM 权限修复步骤。
name: 'Instrumented tests attempt'
description: 'One instrumented-test attempt: restore KVM access, clean adb/emulator residue, boot emulator, run connected tests'
inputs:
  api-level:
    description: 'Android API level for the emulator'
    required: true
  target:
    description: 'System image target (google_apis / default)'
    required: true
  arch:
    description: 'Emulator architecture'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Restore /dev/kvm access (kvm4all udev rule)
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm || echo "[WARN] /dev/kvm not present on this runner — hardware acceleration unavailable"

    - name: Clean up stale adb/emulator state
      shell: bash
      run: |
        pkill -f qemu-system 2>/dev/null || true
        pkill -f 'emulator' 2>/dev/null || true
        adb kill-server 2>/dev/null || true
        sleep 2
        adb start-server 2>/dev/null || true

    - name: Run connected tests (android-emulator-runner)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        target: ${{ inputs.target }}
        arch: ${{ inputs.arch }}
        profile: pixel_5
        heap-size: 512M
        ram-size: 2048M
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        disable-animations: true
        script: |
          # :benchmark 模块的宏基准测试设计上要求 release（不可调试）构建，
          # 在 debug 构建上会被 androidx.benchmark 整体拒绝（实测 13 个全失败，
          # PR #22 run 34924979150）；它由夜间 macrobenchmark job 负责（那里
          # 会先 assembleRelease）。这里排除之，只跑业务模块的 connected 测试。
          ./gradlew connectedDebugAndroidTest -x :benchmark:connectedDebugAndroidTest --stacktrace
