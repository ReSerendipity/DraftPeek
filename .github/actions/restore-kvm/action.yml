name: Restore /dev/kvm access
description: '恢复 runner 上 /dev/kvm 的访问权限（kvm4all udev 规则），否则 android-emulator-runner 退回软件渲染、600s 内启不来'

runs:
  using: composite
  steps:
    # 背景：runner 镜像更新后 /dev/kvm 对 runner 用户失去默认访问权限，
    # 模拟器静默退回软渲染 —— 表现不是崩溃而是启动超时（release.yml 的
    # Macrobenchmark 步骤 exit code 224 即此）。与 .github/actions/instrumented-tests
    # 内联的同名步骤保持一致。
    - name: Restore /dev/kvm access (kvm4all udev rule)
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm || echo "[WARN] /dev/kvm not present on this runner — hardware acceleration unavailable"
