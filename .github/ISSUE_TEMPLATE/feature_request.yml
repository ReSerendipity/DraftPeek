name: 功能请求
description: 提出一个新功能建议
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！请详细描述你的需求，帮助我们理解其价值。

  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 要解决的问题
      description: 你为什么需要这个功能？它解决了什么问题？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望怎么实现？描述你期望的功能行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他实现方式？为什么当前方案更好？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      description: 这个功能主要涉及哪一部分？
      options:
        - UI / 交互
        - 编辑器核心
        - CRDT 协作
        - 导入 / 导出
        - 其他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 这个功能对你的重要程度
      options:
        - 高 - 严重影响使用体验
        - 中 - 有更好，没有也能用
        - 低 - 锦上添花
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: UI/UX 建议（可选）
      description: 如果涉及界面改动，描述你期望的交互方式或附上草图
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 还有其他需要说明的吗？
    validations:
      required: false