name: structure-guard

on:
  push:
    branches: [main]
  pull_request:
  # 供 main-verify.yml 用 workflow_dispatch 补跑必需检查：automerge 以
  # GITHUB_TOKEN 身份合并 PR 时，main push 事件被 GitHub 抑制，需显式派发。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check repository root layout
        run: python .github/scripts/check_layout.py
      - name: Check spec references (if present)
        run: |
          if [ -f scripts/check_spec_refs.py ]; then
            python scripts/check_spec_refs.py
          else
            echo "scripts/check_spec_refs.py not present; skipping"
          fi
