name: structure-guard

on:
  push:
    branches: [main]
  pull_request:
  # 供 main-verify.yml 用 workflow_dispatch 补跑必需检查：automerge 以
  # GITHUB_TOKEN 身份合并 PR 时，main push 事件被 GitHub 抑制，需显式派发。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check repository root layout
        run: python .github/scripts/check_layout.py
      # T1-g: 依赖倒置边界守卫 —— core:domain 不得依赖 core:data。
      # 与根布局守卫同等级：脚本缺失/失败直接使 job 失败，不静默放行。
      - name: Check domain←data dependency boundary
        run: python .github/scripts/check_domain_boundary.py
      # 架构技术债 Flash 报告 P1-3：模块依赖方向全量守卫（R1 core 不依赖 feature/app、
      # R2/R3 无人依赖 app、R6 自依赖、R7 core 子图无环）。与上一条单边守卫互补；
      # 脚本缺失/失败直接使本 job 失败，不静默放行。
      - name: Check module dependency directions
        run: python .github/scripts/check_module_direction.py
      # 与 docs-consistency.yml 的 spec-refs job 保持同一强制等级：无条件执行。
      # 脚本缺失/改名时 python 直接以非零退出使本 job 失败，不再静默放行；
      # 「auditor 不在库」的降级判定由脚本自身按 CI 环境变量分流（CI=true 则
      # fail-fast，本地无 sibling 才 skip），不在 workflow 里重复。
      - name: Check spec references
        run: python scripts/check_spec_refs.py
      # T2: 巨型屏幕文件拆分后的行数上限门禁 —— ui/sora 目录 .kt 单文件
      # 超过 2000 行即失败；豁免清单见 check_file_line_limit.py 头部。
      - name: Check per-file line-count ceiling
        run: python .github/scripts/check_file_line_limit.py
