# ============================================================
# DraftPeek Android CI
# ============================================================
# DevOps: [H4] - 持续集成工作流，覆盖 lint、debug build、单元测试、覆盖率、
# release build、instrumented 测试。
# 设计原则：
#   1) H2 无状态：runner 每次 fresh 启动，无残留状态；
#   2) H4 部署友好：失败立即通知，artifact 保留 7 天用于回溯；
#   3) Fail Fast：lint/compile/test 任一失败即终止流程；
#   4) 缓存优化：gradle deps + wrapper 缓存降低冷启动时间；
#   5) Release 验证：使用 CI 测试签名验证 release 构建（非发布签名）。
#   6) 覆盖率度量：JaCoCo 生成 XML/HTML 报告，Codecov 上传趋势监控。
#   7) PR 质量门禁：测试结果标注到 PR，覆盖率变化可视化。
# ============================================================

name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整 git 历史，供 versioning 插件使用

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create local.properties (CI fallback)
        # CI 环境没有签名凭据，仅 debug 构建可成功。release 构建会因
        # signing.gradle 的 Fail Fast 逻辑跳过（debug 构建不加载 signingConfigs）。
        run: |
          echo "ci.build=true" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Lint
        run: ./gradlew lint --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests with Coverage
        run: ./gradlew test jacocoTestReport --stacktrace

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draftpeek-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/build/reports/jacoco/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          retention-days: 7
          if-no-files-found: warn

      # PR 测试结果标注 — 将失败用例标注到 PR 文件行
      - name: Publish Unit Test Results
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/build/test-results/**/*.xml
          check_name: "Unit Test Results"
          comment_title: "单元测试结果"
          comment_mode: always
          compare_earlier: true
          hide_comments: orphaned
          test_changes_limit: 10

      # 覆盖率门禁 — 检查项目整体覆盖率是否达到 60% 阈值
      - name: Check Coverage Threshold
        run: |
          REPORT_FILE="app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "[WARN] JaCoCo report not found at $REPORT_FILE — skipping coverage gate."
            exit 0
          fi
          # 解析 XML 中的覆盖率百分比（instruction coverage）
          COVERED=$(grep -o 'covered="[0-9]*"' "$REPORT_FILE" | head -1 | grep -o '[0-9]*')
          MISSED=$(grep -o 'missed="[0-9]*"' "$REPORT_FILE" | head -1 | grep -o '[0-9]*')
          if [ -z "$COVERED" ] || [ -z "$MISSED" ]; then
            echo "[WARN] Could not parse coverage from $REPORT_FILE — skipping."
            exit 0
          fi
          TOTAL=$((COVERED + MISSED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "[WARN] No coverage data — skipping."
            exit 0
          fi
          PCT=$((COVERED * 100 / TOTAL))
          echo "Project coverage: ${PCT}% (covered=$COVERED, missed=$MISSED, total=$TOTAL)"
          if [ "$PCT" -lt 60 ]; then
            echo "[FAIL] Coverage ${PCT}% is below 60% threshold."
            exit 1
          fi
          echo "[PASS] Coverage ${PCT}% meets 60% threshold."

      # Codecov 覆盖率上传 — 可视化覆盖率变化趋势
      - name: Upload Coverage to Codecov
        if: always() && github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          files: |
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            core/common/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            core/data/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            feature/editor/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            feature/browser/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          fail_ci_if_error: false
          verbose: true

  # Instrumented 测试 — 在 Android 模拟器上运行 Compose UI 测试和 DAO 测试
  # 多 API 级别矩阵：覆盖 minSdk(26)、中间版本(30)、高版本(34)
  instrumented-tests:
    name: Instrumented Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
            arch: x86_64
          - api-level: 30
            target: google_apis
            arch: x86_64
          - api-level: 34
            target: google_apis
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create local.properties (CI fallback)
        run: |
          echo "ci.build=true" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 使用 android-emulator-runner 运行 instrumented 测试
      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_5
          heap-size: 512M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload Instrumented Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTest/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn

  release-build:
    name: Release Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate CI test signing keystore
        # 生成 CI 专用的测试签名密钥（非发布密钥），用于验证 release 构建流程。
        # 此密钥仅用于 CI 验证，不用于正式发布。正式发布仍需 release.jks。
        run: |
          keytool -genkeypair \
            -alias ci-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore ci-release.jks \
            -storepass citest123 \
            -keypass citest123 \
            -dname "CN=CI Test, OU=Dev, O=DraftPeek, L=CI, ST=CI, C=CN"

      - name: Configure local.properties with CI signing credentials
        run: |
          echo "ci.build=true" > local.properties
          echo "RELEASE_STORE_FILE=ci-release.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=citest123" >> local.properties
          echo "RELEASE_KEY_ALIAS=ci-test" >> local.properties
          echo "RELEASE_KEY_PASSWORD=citest123" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draftpeek-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn

  # Macrobenchmark 性能测试 — 在 Android 模拟器上运行启动基准测试和文件读取基准测试
  # 使用 Release 构建（minified）以获取真实的性能数据
  # 注意：AGP 8.7.x 有 Baseline Profile 生成器崩溃已知问题（Gotcha #13），
  #       因此仅运行 benchmark 测试，不生成 Baseline Profile。
  macrobenchmark:
    name: Macrobenchmark (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            target: google_apis
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create local.properties (CI fallback)
        run: |
          echo "ci.build=true" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK for Benchmark
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Run Macrobenchmark Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_5
          heap-size: 512M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :benchmark:connectedBenchmarkAndroidTest --stacktrace

      - name: Upload Benchmark Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTest/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/macrobenchmark/**
          retention-days: 14
          if-no-files-found: warn
