# ============================================================
# DraftPeek Android CI
# ============================================================
# DevOps: [H4] - 持续集成工作流，覆盖 lint、debug build、单元测试、覆盖率、
# release build、instrumented 测试。
# 设计原则：
#   1) H2 无状态：runner 每次 fresh 启动，无残留状态；
#   2) H4 部署友好：失败立即通知，artifact 保留 7 天用于回溯；
#   3) Fail Fast：lint/compile/test 任一失败即终止流程；
#   4) 缓存优化：gradle deps + wrapper 缓存降低冷启动时间；
#   5) Release 验证：使用 CI 测试签名验证 release 构建（非发布签名）。
#   6) 覆盖率度量：JaCoCo 生成 XML/HTML 报告，Codecov 上传趋势监控。
#   7) PR 质量门禁：测试结果标注到 PR，覆盖率变化可视化。
# ============================================================

name: Android CI

on:
  workflow_dispatch:
  schedule:
    # 夜间全量档：每日 02:00 UTC（北京时间 10:00）在默认分支跑全流程，
    # 使 macrobenchmark（夜间性能基线）与全矩阵 instrumented 测试周期性执行。
    - cron: '0 2 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # 30 分钟在 Gradle 8.12 + 全量 lint/build/单测下容易触顶被 cancel（见 run 33536584657）：
    # spotless(~2m)+lint(~7m)+build(~5m)+unit tests(~14m)+uploads 合计已逼近 30m 上限，
    # 即使单测通过也会在收尾阶段被超时取消，造成“假红”。提到 45 分钟留出余量。
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 完整 git 历史，供 versioning 插件使用

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Gradle wrapper
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-

      - name: Create local.properties (CI fallback)
        # CI 环境没有签名凭据，仅 debug 构建可成功。release 构建会因
        # signing.gradle 的 Fail Fast 逻辑跳过（debug 构建不加载 signingConfigs）。
        run: |
          echo "ci.build=true" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run Lint
        # AGP lint model 的 config-cache 存储在 CI 上不稳定（generateDevDebugAndroidTestLintModel 序列化失败），与 test/jacoco 步骤同策略禁用
        run: ./gradlew lint --stacktrace --no-configuration-cache

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-configuration-cache

      # 单元测试是真正的门禁：约 1058 个用例（@Test 实测统计，见测试体系评估报告 §0）
      # 全部通过即视为构建健康。
      # JaCoCo 报告生成与之解耦——历史 run 因未启用 enableUnitTestCoverage
      # 且 productFlavor 改变了测试变体名（testDevDebugUnitTest 而非 testDebugUnitTest），
      # jacocoTestReport 任务找不到 .exec 而失败，导致整条 CI 假红。
      # 此处将报告生成降级为尽力而为的非阻塞步骤，避免掩盖真实的测试失败。
      - name: Run Unit Tests
        run: ./gradlew test --stacktrace --no-configuration-cache

      # 覆盖率报告生成（2026-09-05 重写）：
      # 原先这里只有一行 `./gradlew jacocoTestReport ... || echo "[WARN]"`，
      # 而根项目当时**根本没有** jacocoTestReport 任务 → 每轮都报
      # "Task 'jacocoTestReport' not found in root project" 并被 || 吞掉，
      # 所有覆盖率报告从未生成过（静默失效，详见 GOTCHAS #37）。
      # 现分两步：app 报告是下方硬门禁的唯一输入，必须成功（blocking）；
      # 其余模块报告供 Codecov 分模块门禁使用，best-effort 不阻断主流程。
      - name: Generate Coverage Report
        if: always()
        run: |
          ./gradlew :app:jacocoTestReport --stacktrace --no-configuration-cache
          ./gradlew jacocoTestReport --stacktrace --no-configuration-cache \
            || echo "[WARN] Non-app coverage reports failed (non-blocking, Codecov only)"

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draftpeek-debug-apk
          # assembleDebug 会产出全部 flavor（dev/production/staging）的 debug APK，路径含 flavor 层
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/build/reports/jacoco/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          retention-days: 7
          if-no-files-found: warn

      # PR 测试结果标注 — 将失败用例标注到 PR 文件行
      - name: Publish Unit Test Results
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/build/test-results/**/*.xml
          check_name: "Unit Test Results"
          comment_title: "单元测试结果"
          comment_mode: always
          compare_earlier: true
          hide_comments: orphaned
          test_changes_limit: 10

      # 覆盖率门禁 — 检查 app 模块指令覆盖率是否达到阈值
      #
      # ⚠️ 阈值沿革（改动前必读）：原为 60%，但那是**从未被真实数据验证过的空想值**——
      # JaCoCo 报告此前从未真正产出过（GOTCHAS #37），这条门禁实际上从未跑过一次。
      # 2026-09-05 修复产出链路后首次实测：app 指令覆盖率 **4.8%**（行 5.4% / 分支 3.9%），
      # 全局加权行覆盖 7.7% —— 距 60% 有数量级差距，保留原值等于让每次 CI 必红。
      #
      # 现改为「实测基线 + ratchet（只升不降）」：阈值取 4%（低于实测 4.8%，留 0.8pt 抖动余量）。
      # 它依然能拦住真实回归：报告丢失 / exec 未生成 / 覆盖率断崖式下跌至 0。
      # 后续覆盖率提升时，必须同步上调 COVERAGE_MIN，禁止为过 CI 而下调。
      - name: Check Coverage Threshold
        run: |
          COVERAGE_MIN=4
          REPORT_FILE="app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "[FAIL] JaCoCo report not found at $REPORT_FILE — coverage gate cannot verify, failing."
            exit 1
          fi
          # 解析报告级（最后一个）INSTRUCTION 计数器作为项目整体覆盖率。
          # 旧写法假定属性顺序 covered 在前，但 JaCoCo 实际输出 missed 在前 —— grep
          # 永远匹配不到，在 -e -o pipefail 下静默退出（2026-09-08 首次真跑暴露），
          # 门禁从未真正运行过。现改为属性顺序无关提取，并容忍 grep 空匹配。
          INSTR_LINE=$(grep -o '<counter type="INSTRUCTION"[^>]*>' "$REPORT_FILE" | tail -1) || true
          if [ -z "$INSTR_LINE" ]; then
            echo "[FAIL] Could not parse coverage from $REPORT_FILE — failing."
            exit 1
          fi
          COVERED=$(echo "$INSTR_LINE" | grep -o 'covered="[0-9]*"' | grep -o '[0-9]*') || true
          MISSED=$(echo "$INSTR_LINE" | grep -o 'missed="[0-9]*"' | grep -o '[0-9]*') || true
          if [ -z "$COVERED" ] || [ -z "$MISSED" ]; then
            echo "[FAIL] Could not parse coverage from $REPORT_FILE — failing."
            exit 1
          fi
          TOTAL=$((COVERED + MISSED))
          if [ "$TOTAL" -eq 0 ]; then
            echo "[FAIL] No coverage data — failing."
            exit 1
          fi
          PCT=$((COVERED * 100 / TOTAL))
          echo "Project coverage: ${PCT}% (covered=$COVERED, missed=$MISSED, total=$TOTAL)"
          if [ "$PCT" -lt "$COVERAGE_MIN" ]; then
            echo "[FAIL] Coverage ${PCT}% is below ${COVERAGE_MIN}% threshold."
            exit 1
          fi
          echo "[PASS] Coverage ${PCT}% meets ${COVERAGE_MIN}% threshold."

      # Codecov 覆盖率上传 — 可视化覆盖率变化趋势
      - name: Upload Coverage to Codecov
        if: always() && github.event_name == 'pull_request'
        uses: codecov/codecov-action@v6
        with:
          # 补全全部会产出报告的模块（原先只列 5 个，漏了 core/domain、core/ui、
          # feature/settings、feature/stats、feature/terminal —— 这些模块的覆盖率
          # 从未上传过，codecov.yml 里对它们的分模块门禁自然也无从生效）。
          # 不列 core/designsystem、core/testing、benchmark：它们没有 src/test，本就不产报告。
          files: |
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            core/common/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            core/data/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            core/domain/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            core/ui/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            feature/editor/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            feature/browser/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            feature/settings/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            feature/stats/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            feature/terminal/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          fail_ci_if_error: false
          verbose: true

  # Instrumented 测试矩阵选择器（分级门禁，见测试体系评估报告 Q2）：
  # - PR 档（pull_request）：只跑 API 30（google_apis）单机型，控制 PR 时长增量约 +20min；
  # - 全量档（workflow_dispatch / schedule）：API 26 / 30 / 34 全矩阵，发布前或夜间执行。
  # 动态矩阵必须经由 setup job 的 outputs 注入，strategy.matrix 不支持内联条件。
  instrumented-matrix:
    name: Select Instrumented Matrix
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"include":[{"api-level":30,"target":"google_apis","arch":"x86_64"}]}' >> "$GITHUB_OUTPUT"
          else
            # 26 档必须用 google_apis：`default` 镜像不带 WebView provider，
            # 任何实例化 WebView 的用例都会以
            # MissingWebViewPackageException: No WebView installed 失败（run 268 实测 6 条）。
            echo 'matrix={"include":[{"api-level":26,"target":"google_apis","arch":"x86_64"},{"api-level":30,"target":"google_apis","arch":"x86_64"},{"api-level":34,"target":"google_apis","arch":"x86_64"}]}' >> "$GITHUB_OUTPUT"
          fi

  instrumented-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: Instrumented Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-and-test, instrumented-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.instrumented-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Gradle wrapper
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-

      - name: Create local.properties (CI fallback)
        run: |
          echo "ci.build=true" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 2026-09-14 起 PR 档模拟器 adb 起不来（Unable to connect to adb daemon on
      # port: 5037）在 PR #22 上三连败，android-emulator-runner 无内建重试。
      # 拆成 attempt1/attempt2 两次调用同一 composite action（.github/actions/
      # instrumented-tests）：attempt2 仅在 attempt1 失败时执行，且执行前先强清理
      # adb/模拟器残留。两次都失败仍然红——只吸收单次基础设施抖动，不掩盖真实回归。
      # 注意：job 级 timeout-minutes: 45 同时罩住两次尝试，attempt1 若挂满超时则
      # attempt2 不会执行（fail-fast 语义保持）。
      - name: Run Instrumented Tests (attempt 1)
        id: inst_attempt_1
        uses: ./.github/actions/instrumented-tests
        continue-on-error: true
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}

      - name: Run Instrumented Tests (attempt 2, retry after adb/emulator cleanup)
        id: inst_attempt_2
        if: steps.inst_attempt_1.outcome == 'failure'
        uses: ./.github/actions/instrumented-tests
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}

      - name: Upload Instrumented Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTest/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: warn

  release-build:
    name: Release Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Gradle wrapper
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-

      - name: Generate CI test signing keystore
        # 生成 CI 专用的测试签名密钥（非发布密钥），用于验证 release 构建流程。
        # 此密钥仅用于 CI 验证，不用于正式发布。正式发布仍需 release.jks。
        # 注意：app 模块的 release 签名配置把 RELEASE_STORE_FILE 当成相对路径，
        # 解析基址是 app/ 模块目录（故查找 app/ci-release.jks），因此密钥必须
        # 生成在 app/ 下，否则 validateSigningXxxRelease 会因找不到密钥而失败。
        run: |
          keytool -genkeypair \
            -alias ci-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore app/ci-release.jks \
            -storepass citest123 \
            -keypass citest123 \
            -dname "CN=CI Test, OU=Dev, O=DraftPeek, L=CI, ST=CI, C=CN"

      - name: Configure local.properties with CI signing credentials
        run: |
          echo "ci.build=true" > local.properties
          echo "RELEASE_STORE_FILE=ci-release.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=citest123" >> local.properties
          echo "RELEASE_KEY_ALIAS=ci-test" >> local.properties
          echo "RELEASE_KEY_PASSWORD=citest123" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draftpeek-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn

  # Macrobenchmark 性能测试 — 在 Android 模拟器上运行启动基准测试和文件读取基准测试
  # 使用 Release 构建（minified）以获取真实的性能数据
  # 档位（测试体系评估报告 Q2）：夜间 schedule 档 + 手动 dispatch 档，不阻塞 PR。
  # 注意：AGP 8.7.x 有 Baseline Profile 生成器崩溃已知问题（Gotcha #13），
  #       因此仅运行 benchmark 测试，不生成 Baseline Profile。
  macrobenchmark:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: Macrobenchmark (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            target: google_apis
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Cache Gradle wrapper
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-

      - name: Create local.properties (CI fallback)
        run: |
          echo "ci.build=true" > local.properties

      # 被测应用需 release 变体（非 debuggable + minified），CI 无 release.jks ——
      # 与 release-build job 相同：生成一次性 CI 测试签名（非发布密钥）。
      # 密钥必须生成在 app/ 下：RELEASE_STORE_FILE 相对路径解析基址是 app/ 模块目录，
      # 否则 packageDevRelease 会因 SigningConfig 缺 storeFile 失败（2026-09-09 实测）。
      - name: Generate CI test signing keystore
        run: |
          keytool -genkeypair \
            -alias ci-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore app/ci-release.jks \
            -storepass citest123 \
            -keypass citest123 \
            -dname "CN=CI Test, OU=Dev, O=DraftPeek, L=CI, ST=CI, C=CN"

      - name: Configure local.properties with CI signing credentials
        run: |
          echo "RELEASE_STORE_FILE=ci-release.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=citest123" >> local.properties
          echo "RELEASE_KEY_ALIAS=ci-test" >> local.properties
          echo "RELEASE_KEY_PASSWORD=citest123" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK for Benchmark
        run: ./gradlew :app:assembleRelease --stacktrace

      # 与 .github/actions/instrumented-tests 同款清场：本 job 没有 instrumented 那样
      # 的 attempt1/attempt2 重试，一次 adb 5037 残留就直接红（run 268 即此因）。
      - name: Clean up stale adb/emulator state
        shell: bash
        run: |
          pkill -f qemu-system 2>/dev/null || true
          pkill -f 'emulator' 2>/dev/null || true
          adb kill-server 2>/dev/null || true
          sleep 2
          adb start-server 2>/dev/null || true

      - name: Restore /dev/kvm access
        # 与 release.yml 的 benchmark 步骤同源问题：android.yml 的 benchmark job 也从未
        # 恢复过 kvm（PR #42 当时只打在 instrumented 路径上）。
        uses: ./.github/actions/restore-kvm

      - name: Run Macrobenchmark Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_5
          heap-size: 512M
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # benchmark 是 library 模块，androidTest 只生成 debug 测试变体——
            # connectedBenchmarkAndroidTest 任务不存在（2026-09-05 实测 tasks --all 确认）。
            # 夜间档此前从未真正跑过：先倒在 desugaring 编译错误上，编译修好后
            # 也会倒在幻影任务名上。
            #
            # 被测应用必须由本步显式安装：上一步 `:app:assembleRelease` 只构建、不安装
            # （此处旧注释「被测应用由上一步 assembleRelease 安装」是错的，夜间档因此长期
            # 停在 5 条 "Unable to find target package com.draftpeek, is it installed?"，
            # 见 schedule run 35829798988 / 35697952911）。production flavor 无
            # applicationId 后缀，包名才是 benchmark 要的 com.draftpeek
            # （benchmark/src/androidTest/.../EditorBenchmarkSupport.kt:30）。
            # 整段压成一行是硬性要求：android-emulator-runner 把 script 逐行交给
            # /usr/bin/sh -c 执行，跨行控制流与跨行变量都不可依赖
            # （release.yml run #5 实测：if/fi 被拆进两次调用 → "end of file unexpected"、
            # exit 2）。同一条单行写法在 release.yml run #6 已验证有效。
            APK_PATH=$(find app/build/outputs/apk/production/release -name '*.apk' | head -1); test -n "$APK_PATH" || { echo '::error::No production release APK available to install'; exit 1; }; adb install -r -g "$APK_PATH"
            # A' 方案：预置两道首启门（引导页 DataStore onboarding/completed + 协议弹窗
            # SharedPreferences agreement/accepted_v1），让用例走真实用户的 LAUNCHER 路径
            # 由 SplashActivity 自己导航进 MainActivity —— 不再直启、也不再点 UI 走引导。
            # 逻辑必须落在文件里：本 action 把 script 逐行交给 /usr/bin/sh -c，多步 shell
            # （root 断言、写完回读自证、fail-closed 三件套）在跨行上下文里活不下来。
            # 顺序要求：被测包先装（/data/data/com.draftpeek 由安装产生）再预置。
            bash benchmark/ci/preseed-onboarding-gate.sh
            ./gradlew :benchmark:connectedDebugAndroidTest --stacktrace

      - name: Upload Benchmark Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTest/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/macrobenchmark/**
          retention-days: 14
          if-no-files-found: warn
