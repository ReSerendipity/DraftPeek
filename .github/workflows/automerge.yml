name: Auto-merge

# 合并后必须原地补跑 main CI：本 workflow 用 GITHUB_TOKEN 启用 auto-merge，
# 合并记录为 merged_by=github-actions[bot]，GitHub 会抑制由 GITHUB_TOKEN 触发的
# 后续事件——实测 push 与 pull_request.closed 两条路都不再创建 workflow run，
# 所以 bot 合并进来的 main commit 会 0 check run、UI 无绿勾。唯一不被抑制的是
# workflow_dispatch，因此由本 job 在确认合并落地后自己派发。
# （Main Verify 的 schedule 只作兜底：实测本仓库 schedule 有约 5.5 小时系统延迟。）

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # 派发 main CI 需要 Actions write
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event.pull_request.draft == false
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Fetch Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-commit-verification: true
          skip-verification: true

      - name: Enable auto-merge for non-major Dependabot PRs
        if: github.event.pull_request.user.login == 'dependabot[bot]' && steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Enable auto-merge for labeled PRs
        if: contains(github.event.pull_request.labels.*.name, 'automerge')
        run: gh pr merge --auto --squash "$PR_URL"

      # 与上面两个「启用开关」步骤同条件。auto-merge 由 GitHub 异步执行，
      # 本步骤轮询到 PR 真正 MERGED 之后再派发，确保 workflow_dispatch 绑定的是
      # 本次合并产生的新 main HEAD。
      - name: Re-dispatch required CI onto main after the merge lands
        if: (github.event.pull_request.user.login == 'dependabot[bot]' && steps.meta.outputs.update-type != 'version-update:semver-major') || contains(github.event.pull_request.labels.*.name, 'automerge')
        run: |
          set -euo pipefail

          merged=false
          for _ in $(seq 1 160); do
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            if [ "${state}" = "MERGED" ]; then
              merged=true
              break
            fi
            if [ "${state}" = "CLOSED" ]; then
              echo "PR 已关闭且未合并，无需补跑。"
              exit 0
            fi
            sleep 30
          done

          if [ "${merged}" != "true" ]; then
            echo "::warning::等待 auto-merge 落地超时（约 80 分钟），本轮不补跑，交由 Main Verify 的 schedule 兜底"
            exit 0
          fi

          # 精确锚定「本 PR 合并产生的那个 commit」。
          # 不能用 --ref main：实测 #51 与 #52 在 8:14:19 / 8:14:23 相隔 4 秒合并，
          # 两个 job 都按 main HEAD 派发，结果检查全打到后合并的 adf9e24 上（重复 4 个
          # layout），而 #51 自己的 4ef60ae 一个必需检查都没有、永久裸奔。
          ms="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .merge_commit_sha)"
          if [ -z "${ms}" ] || [ "${ms}" = "null" ]; then
            echo "::warning::取不到本 PR 的 merge_commit_sha，退回按 main 派发"
            ms="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          fi
          tag="ci-verify-${ms:0:7}"
          echo "PR 已合并，锚定 commit ${ms:0:7} 派发必需检查。"

          # workflow_dispatch 的 ref 只接受分支/tag，裸 commit SHA 会被拒
          # （实测 422 No ref found），故先建临时 tag 锚定该 commit。tag 不以 v 开头，
          # 不会触发 release.yml；run 创建时 head_sha 已固定，所以派发完即可删除。
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -X POST -f "ref=refs/tags/${tag}" -f "sha=${ms}" >/dev/null 2>&1 \
            || echo "tag ${tag} 已存在，直接复用"

          for wf in android.yml structure-guard.yml; do
            echo "::notice::派发 ${wf} → ${tag}"
            gh workflow run "${wf}" --ref "${tag}" --repo "${GITHUB_REPOSITORY}"
          done

          # 不能在这里删 tag：actions/checkout 是在 runner 真正起跑时才按 ref 名去
          # fetch 的，head_sha 固定并不代表 ref 可以提前消失。实测派发后 5 秒删除
          # 会让排队中的 Build & Test 直接挂在 checkout：
          #   fatal: couldn't find remote ref refs/tags/ci-verify-fff8410
          # 所以 tag 保留，只由下面的 GC 回收过期的（Build & Test 上限 45 分钟，
          # 留 6 小时余量足以覆盖排队与重试）。
          cutoff="$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          for ref in $(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" \
              --jq '.[].ref' 2>/dev/null | grep '/ci-verify-' || true); do
            name="${ref##*/}"
            short="${name#ci-verify-}"
            when="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${short}" \
              --jq '.commit.committer.date' 2>/dev/null || true)"
            if [ -z "${when}" ]; then
              continue
            fi
            if [[ "${when}" < "${cutoff}" ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${name}" \
                >/dev/null 2>&1 || true
              echo "回收过期锚定 tag ${name}（commit ${when}）"
            fi
          done
