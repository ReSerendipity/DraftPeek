# ============================================================
# DraftPeek Server CI (Python)
# ============================================================
# 覆盖 server/ 下的 Python 协作同步服务（crdt_server / integrity_server /
# sync_server）。作为评估报告中 P0-1 / Q3 的最低成本质量门禁：
#   - ruff      静态检查（F/E/I，见 server/ruff.toml）
#   - pytest    功能测试（server/tests，pytest.ini 已配 asyncio auto）
#   - pip-audit 依赖漏洞审计（仅对 requirements.txt 的精确 pin 生效）
#
# 注意：这是独立于 Kotlin 主链路的辅助门禁，仅在 server/ 变更时触发。
#
# 必需检查身份（2026-10-06 gh api 实测核对）：本工作流**不是**分支保护的必需检查。
# live required contexts 只有 `Build & Test`、`layout`、`Lock Integrity (server
# lock resolvability)` 三项，与 docs/ci/branch-protection.json 的 contexts 一致，
# 其中不含 "Server CI (Python)"。旧注释自称必需检查与远端不符，已按事实更正。
# ============================================================

name: Server CI (Python)

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main, develop]
    # PR 档刻意不加 paths 过滤。理由不是「必需检查不带 paths」（本工作流并非必需
    # 检查，见顶部说明；那条规则只对真必需检查成立 —— 否则仅改 .github/ 的 PR 会
    # 被 GitHub 判定 "Expected — Waiting for status to be reported" 而永久 BLOCKED），
    # 而是：让每个 PR 都拿到 Python 侧回归信号，避开 .github/ 与 server/ 交叉改动
    # （依赖 pin、镜像版本）时该检查被静默跳过。main push 档仍保留 paths 节省算力。
    # 若将来把本工作流升为必需检查，须同步三处：docs/ci/branch-protection.json 的
    # contexts、.github/workflows/main-verify.yml 的 CONTEXT_OWNERS，并重跑
    # scripts/apply_branch_protection.py 只读模式直到报 [OK] 无漂移；远端写回 --apply
    # 需单独授权。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Lint + Test + Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest tests -q

      - name: Dependency audit (pip-audit)
        # pip-audit 不支持按 severity 分级退出码（--fail-on 是无效参数，会导致
        # argparse 报错 exit 2）；按 requirements.txt 精确 pin 审计，发现任何已知漏洞即阻断。
        # 2026-09-08 实测：当前全部 pin 无已知漏洞。
        run: pip-audit -r requirements.txt
