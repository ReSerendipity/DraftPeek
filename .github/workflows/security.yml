# ============================================================
# DraftPeek Security Review Workflow
# ============================================================
# 学习借鉴：Image_MultiModel / Seedvr2 / SpiritPal 的安全审查机制。
# 覆盖四种安全审查维度：
#   1) dependency-review —— PR 中依赖变更的漏洞审查（GitHub 官方，基于 OSV）
#   2) CodeQL         —— 静态安全分析（kotlin/java），security-and-quality 套件
#   3) secret-scan    —— 密钥泄露扫描（Trivy FS，学习 Image_MultiModel）
#   4) 定时任务       —— 每周定期全量安全扫描
# ============================================================

name: Security Review

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每周一 01:00 UTC 定期全量扫描
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 依赖漏洞审查 (dependency-review) ──────────────────
  # 学习 Image_MultiModel 的依赖扫描思路：审查 PR 引入/变更的
  # Gradle/Maven 依赖，命中已知漏洞时阻断合并。
  dependency-review:
    name: Dependency Review (PR 依赖变更审查)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # 仅审查依赖变更 diff，不审查完整 SBOM
          comment-summary-in-pr: always

  # ── 2. CodeQL 静态安全分析 ──────────────────────────────
  # 学习 Image_MultiModel / SpiritPal 的 CodeQL 配置，使用
  # security-and-quality 查询套件（含安全 + 代码质量）。
  codeql:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: CodeQL (kotlin/java 静态安全分析)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: manual

      # 预编译依赖以保证 CodeQL 能正确分析 Kotlin 代码
      # (AGP 项目 Autobuild 不可靠，改用显式 Gradle 编译)
      # 注意：app 模块有多个 product flavor，需要指定具体的构建任务
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDevDebugKotlin --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  # ── 3. 密钥泄露扫描 (Trivy FS) ──────────────────────────
  # 学习 Image_MultiModel 的 secret-scan job：扫描整个仓库
  # 历史中的密钥/Token 泄露，防止凭据意外提交。
  secret-scan:
    name: Secret Scanning (Trivy FS 密钥泄露扫描)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout (含完整历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (2026-04-22 官方攻击响应后最新稳定版; SHA pin 防 tag 强更)
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'
          # 排除构建产物/缓存/IDE/日志目录，避免 hex 高熵日志误报；
          # 真实源码（app/src、core、feature、server 等）仍全量扫描。
          # trivy-action 声明式输入（README: skip-dirs/skip-files 逗号分隔），
          # 等价于 CLI 的 --skip-dirs/--skip-files，且不影响其余输入语义。
          # skip-dirs 为相对路径前缀匹配（非 basename）：'*/build' 才能跳过 app/build
          # 等嵌套构建目录（2026-08-16 trivy 0.74.0 实测 'build' 不匹配 app/build）；
          # mapping.txt 为 R8 混淆映射（115MB，含大量 hex），一并跳过。
          skip-dirs: '_archive, */build, .gradle, .kotlin, .idea, node_modules, logs, .cxx'
          skip-files: '*.log, mapping.txt'
