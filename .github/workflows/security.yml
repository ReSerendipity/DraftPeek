# ============================================================
# DraftPeek Security Review Workflow
# ============================================================
# 学习借鉴：Image_MultiModel / Seedvr2 / SpiritPal 的安全审查机制。
# 覆盖四种安全审查维度：
#   1) dependency-review —— PR 中依赖变更的漏洞审查（GitHub 官方，基于 OSV）
#   2) CodeQL         —— 静态安全分析（kotlin/java），security-and-quality 套件
#   3) secret-scan    —— 密钥泄露扫描（Trivy FS，学习 Image_MultiModel）
#   4) python-security —— server/ Python 供应链审计（pip-audit）+ SAST（bandit）（R7 补强）
#   5) 定时任务       —— 每周定期全量安全扫描
# ============================================================

name: Security Review

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每周一 01:00 UTC 定期全量扫描
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. 依赖漏洞审查 (dependency-review) ──────────────────
  # 学习 Image_MultiModel 的依赖扫描思路：审查 PR 引入/变更的
  # Gradle/Maven 依赖，命中已知漏洞时阻断合并。
  dependency-review:
    name: Dependency Review (PR 依赖变更审查)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # 仅审查依赖变更 diff，不审查完整 SBOM
          comment-summary-in-pr: always

  # ── 2. CodeQL 静态安全分析 ──────────────────────────────
  # 学习 Image_MultiModel / SpiritPal 的 CodeQL 配置，使用
  # security-and-quality 查询套件（含安全 + 代码质量）。
  codeql:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: CodeQL (kotlin/java + python 静态安全分析)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: 'java-kotlin'
            build-mode: 'manual'
          - language: 'python'
            build-mode: 'none'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: ${{ matrix.build-mode }}

      # 预编译依赖以保证 CodeQL 能正确分析 Kotlin 代码
      # (AGP 项目 Autobuild 不可靠，改用显式 Gradle 编译)
      # 注意：app 模块有多个 product flavor，需要指定具体的构建任务
      - name: Build with Gradle
        if: matrix.build-mode == 'manual'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDevDebugKotlin --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  # ── 3. 密钥泄露扫描 (Trivy FS) ──────────────────────────
  # 学习 Image_MultiModel 的 secret-scan job：扫描整个仓库
  # 历史中的密钥/Token 泄露，防止凭据意外提交。
  secret-scan:
    name: Secret Scanning (Trivy FS 密钥泄露扫描)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout (含完整历史)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (2026-04-22 官方攻击响应后最新稳定版; SHA pin 防 tag 强更)
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'
          # 排除构建产物/缓存/IDE/日志目录，避免 hex 高熵日志误报；
          # 真实源码（app/src、core、feature、server 等）仍全量扫描。
          # trivy-action 声明式输入（README: skip-dirs/skip-files 逗号分隔），
          # 等价于 CLI 的 --skip-dirs/--skip-files，且不影响其余输入语义。
          # skip-dirs 为相对路径前缀匹配（非 basename）：'*/build' 才能跳过 app/build
          # 等嵌套构建目录（2026-08-16 trivy 0.74.0 实测 'build' 不匹配 app/build）；
          # mapping.txt 为 R8 混淆映射（115MB，含大量 hex），一并跳过。
          skip-dirs: '_archive, */build, .gradle, .kotlin, .idea, node_modules, logs, .cxx'
          skip-files: '*.log, mapping.txt'

  # ── 4. Python 供应链审计 + SAST（R7 补强）────────────────
  # 与 CodeQL（仅 java-kotlin）、Trivy（仅 secret）互补：
  #   pip-audit —— 按 server/requirements-lock.txt 审计已知漏洞
  #   bandit    —— 对 server/ 做 Python 静态安全扫描
  # ── 5. server lock 可安装性门禁（窄口径，阻塞合并）──────────
  # 只回答一个问题：server/requirements-lock.txt 里的 pin 之间能否共存。
  # 刻意不做漏洞审计（那属于下方 python-security 的周期任务）：整表 CVE 扫描一旦
  # 被设为必需，任何上游新披露都会阻塞与本改动毫无关系的 PR。
  # --dry-run 会完整跑一遍 pip 解析器但不安装，足以抓出被独立 bump 后自相矛盾的
  # pin 对（pydantic 2.13.5 要求 pydantic-core==2.46.5，却被组升到 2.49.0，
  # 见 DraftPeek#92 / TTS_MultiModel#87）。
  lock-integrity:
    name: Lock Integrity (server lock resolvability)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 解析器行为随 pip 版本变化，固定为最新以免门禁时好时坏
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Resolve server/requirements-lock.txt without installing
        run: pip install --dry-run -r server/requirements-lock.txt

  # 2026-09-20：从合并门禁降级为“合并后 + 每周”审计。
  # 它审计的是整张 lock（pip-audit --strict）并对整个 server/ 跑 bandit，因此一旦
  # 被设为必需，任何上游新披露的 CVE 都会阻塞与本改动毫无关系的 PR（含纯 Kotlin、
  # 纯文档）。可安装性由上方 lock-integrity 负责；PR 新增依赖的漏洞由 Dependency
  # Review（按 diff 判定，fail-on-severity: high）负责。此处保留 push，使 main 每次
  # 合并后仍会被完整审计一次。
  python-security:
    name: Python Security (pip-audit + bandit)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-lock.txt

      - name: pip-audit (known vulnerability scan)
        run: |
          pip install pip-audit
          pip-audit -r server/requirements-lock.txt --strict

      - name: bandit (Python SAST on server/)
        run: |
          pip install bandit
          # -ll 只报 MEDIUM 及以上；排除 tests/（assert 断言属正常用法）
          bandit -r server --exclude server/tests -ll

  # Node 侧文档导出依赖的最小冒烟。此前全仓没有任何 workflow 跑过 npm
  # （grep "\bnpm\b" .github/workflows/*.yml 只命中 setup-node 之外零处），
  # 也就是 package-lock.json 从没被 CI 校验过 —— 本 job 是给 image-size 提版兜底的唯一实测。
  node-export-smoke:
    name: Node 导出依赖冒烟 (pptx)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: npm ci (严格按锁文件，不接受漂移)
        run: npm ci --no-audit --no-fund

      - name: 依赖树取证 (pptxgenjs 未被降级 + image-size 落在修复版)
        run: npm ls image-size pptxgenjs uuid

      - name: pptx 导出冒烟 (版本闸门 + image-size 解析 + pptxgenjs addImage 写出)
        run: npm run smoke:pptx

      - name: 产物必须是可解开的 zip
        run: |
          test -s build/pptx-smoke.pptx
          unzip -l build/pptx-smoke.pptx
          rm -rf build/unz && unzip -o -q build/pptx-smoke.pptx -d build/unz
          test -s "build/unz/[Content_Types].xml"

      - name: 采集 npm audit (端点不可用不卡 PR，判定在下一步)
        run: |
          mkdir -p build
          npm audit --json > build/audit.json 2> build/audit.err || true
          head -c 120 build/audit.json; echo

      - name: 定向确认 image-size 不再被这两条 high 通告命中
        # 只判 image-size，不设全局 audit 门：registry 不支持 audit 端点时（本机实测
        # npmmirror 返回 404 NOT_IMPLEMENTED）不该把无关 PR 卡死；
        # 而"必须落在 2.0.3+"这条硬闸门在冒烟脚本里，失败即红。
        run: >
          node -e "const fs=require('fs');let d;
          try{d=JSON.parse(fs.readFileSync('build/audit.json','utf8'))}catch(e){console.log('WARN npm audit 无可用 JSON，跳过本步判定');process.exit(0)}
          const v=d.vulnerabilities||{};
          const hits=Object.keys(v).filter(k=>k==='image-size');
          const parents=Object.entries(v).filter(([k,x])=>(x.effects||[]).includes('image-size')).map(([k])=>k);
          console.log('audit image-size 命中='+JSON.stringify(hits)+' 牵连父依赖='+JSON.stringify(parents)+' counts='+JSON.stringify((d.metadata||{}).counts||{}));
          process.exit(hits.length||parents.length?1:0)"
