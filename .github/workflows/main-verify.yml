# ============================================================
# DraftPeek main 补跑守卫
# ============================================================
# 背景（2026-09-15 定位）：
#   automerge.yml 以 GITHUB_TOKEN（github-actions[bot]）身份合并 PR，而 GitHub
#   规定「由 GITHUB_TOKEN 触发的事件不会创建新的 workflow run」，例外只有
#   workflow_dispatch 与 repository_dispatch。于是 bot 合并产生的 main push
#   不会触发任何 CI，main HEAD commit 上没有任何必需检查，GitHub UI 既无绿勾
#   也无红叉（#41/#42/#43 三个合并点均如此；#40 由本人手工合并时一切正常）。
#
# 本 workflow 的职责：
#   定期比对 main HEAD 与其上已报告的 check runs。若分支保护的某个 required
#   context 缺失，说明这次进 main 的 push 被抑制了，则用 workflow_dispatch
#   显式补跑对应 workflow。workflow_dispatch 属于官方例外，补跑必然生效。
#
# 两个关键设计约束：
#   1) required 清单取自 docs/ci/branch-protection.json（本仓库治理的单一来源）。
#      不走 branches/main/protection API：读该端点需要 Administration 权限，而
#      Actions 的 permissions: 合法 key 里根本没有 administration，GITHUB_TOKEN
#      拿不到这个权限（首版误写 administration: read，导致整个 workflow 文件解析
#      失败——run 名退化成文件路径、无任何 job 日志）。远端与文件的一致性由
#      scripts/apply_branch_protection.py 负责，本守卫只管按声明补跑。
#   2) 判定不能用「check runs 总数 > 0」。实测 main HEAD 25abb17 上唯一的
#      check run 来自 Dependabot 的 dynamic workflow（与质量门禁无关），
#      按总数判定会被这类噪音骗过，导致守卫永远跳过补跑。
#
# 为什么用轮询而不是「合并后立刻派发」：
#   automerge.yml 只负责 `gh pr merge --auto`（打开自动合并开关），真正的合并
#   由 GitHub 在条件满足时异步完成，那时该 workflow 早已结束，无法原地感知。
#   轮询式守卫同时能兜住其它漏网场景（手工 bot 操作、CI 配置切换期等）。
#
# 语义边界：
#   这是「合并后验证 main」，不是 Merge Queue 的「合并前用最新 main 重验」。
#   个人账号仓库不具备启用 Merge Queue 的资格（该特性仅对 organization 拥有的
#   公开仓库 / Enterprise Cloud 组织的私有仓库开放），故取此替代形态。
# ============================================================

name: Main Verify

on:
  schedule:
    # 每 15 分钟巡检一次：把绿勾延迟从「最长约 21 小时（等夜间全量档）」
    # 压到「最长 15 分钟 + 一次构建时长」。
    - cron: '*/15 * * * *'
  workflow_dispatch:

# permissions 的合法 key 不含 administration，写进去会让整个 workflow 文件
# 解析失败，因此读分支保护 API 这条路走不通（见顶部设计约束 1）。
permissions:
  contents: read
  actions: write

concurrency:
  group: main-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Re-run CI on bare main HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # context → 提供该 context 的 workflow 文件。
      # 新增必需检查时两边同步：docs/ci/branch-protection.json 的 contexts
      # 与这里的映射。
      CONTEXT_OWNERS: |
        Build & Test=android.yml
        layout=structure-guard.yml

    steps:
      - name: Checkout governance config
        uses: actions/checkout@v7

      - name: Diff required contexts against main HEAD
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}"

          sha="$(gh api "${api}/commits/main" --jq .sha)"
          short="$(printf '%.7s' "${sha}")"

          jq -r '.contexts[]' docs/ci/branch-protection.json | sort > /tmp/required.txt
          gh api "${api}/commits/${sha}/check-runs?per_page=100" \
            --jq '.check_runs[].name' | sort > /tmp/present.txt

          echo "main HEAD = ${short}"
          echo "required contexts:"
          sed 's/^/  - /' /tmp/required.txt
          echo "main HEAD 上已报告的 check runs:"
          sed 's/^/  - /' /tmp/present.txt

          targets=""
          missing=""
          while IFS= read -r ctx; do
            if [ -z "${ctx}" ]; then
              continue
            fi
            if grep -qxF "${ctx}" /tmp/present.txt; then
              echo "  [已报告] ${ctx}"
              continue
            fi
            missing="${missing}${ctx}"$'\n'

            owner=""
            while IFS='=' read -r ctx_name wf_name; do
              if [ "${ctx_name}" = "${ctx}" ]; then
                owner="${wf_name}"
              fi
            done <<< "${CONTEXT_OWNERS}"

            if [ -z "${owner}" ]; then
              echo "::warning::required context「${ctx}」没有登记 owner workflow，无法自动补跑，请人工处理"
              continue
            fi
            echo "  [缺失] ${ctx} → 需派发 ${owner}"
            targets="${targets}${owner}"$'\n'
          done < /tmp/required.txt

          targets="$(printf '%s' "${targets}" | sed '/^[[:space:]]*$/d' | sort -u | tr '\n' ' ')"
          targets="$(printf '%s' "${targets}" | sed 's/[[:space:]]*$//')"
          missing="$(printf '%s' "${missing}" | sed '/^[[:space:]]*$/d' | tr '\n' ',' | sed 's/,$//')"

          {
            echo "#### main HEAD ${short}"
            echo "- 必需检查：$(tr '\n' ',' < /tmp/required.txt | sed 's/,$//')"
            echo "- 已报告：$(tr '\n' ',' < /tmp/present.txt | sed 's/,$//')（空表示该 commit 完全裸奔）"
            echo "- 缺失必需检查：${missing:-（无）}"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "missing=${missing}" >> "${GITHUB_OUTPUT}"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

          if [ -z "${targets}" ]; then
            echo "必需检查齐全（或无可自动补跑的 owner），本轮不派发。"
            echo "need=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # 幂等保护：main 上已有排队/进行中的运行时不重复派发
          queued="$(gh api "${api}/actions/runs?branch=main&status=queued&per_page=1" --jq .total_count)"
          running="$(gh api "${api}/actions/runs?branch=main&status=in_progress&per_page=1" --jq .total_count)"
          if [ "${queued}" -gt 0 ] || [ "${running}" -gt 0 ]; then
            echo "main 上已有 queued=${queued} / in_progress=${running} 的运行，本轮跳过以免重复派发。" \
              >> "${GITHUB_STEP_SUMMARY}"
            echo "need=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "need=true" >> "${GITHUB_OUTPUT}"

      - name: Dispatch missing CI onto main
        if: steps.probe.outputs.need == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ steps.probe.outputs.targets }}
          MISSING: ${{ steps.probe.outputs.missing }}
        run: |
          set -euo pipefail
          echo "补跑原因：main HEAD 缺失必需检查 → ${MISSING}" >> "${GITHUB_STEP_SUMMARY}"
          for wf in ${TARGETS}; do
            echo "::notice::派发 ${wf} → main"
            printf -- '- 派发 `%s`\n' "${wf}" >> "${GITHUB_STEP_SUMMARY}"
            gh workflow run "${wf}" --ref main
          done

      - name: Show resulting runs on main
        if: steps.probe.outputs.need == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 20
          {
            echo '#### 派发后 main 上的运行'
            echo '```'
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=8" \
              --jq '.workflow_runs[] | "\(.event)\t\(.status)\t\(.conclusion // "-")\t\(.name)"'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
