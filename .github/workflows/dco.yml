name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: DCO Check
    # DCO 的 Signed-off-by 是对「人类贡献者有权提交该代码」的来源认证，
    # Dependabot 生成的 commit 结构上无法带签名，每轮升级必然误红。
    # 本检查不在分支保护的必需检查列表内，跳过只会显示为灰色 skipped。
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$base_sha" || -z "$head_sha" ]]; then
            echo "::error::Could not determine PR base/head SHA"
            exit 1
          fi
          fails=0
          while IFS= read -r commit; do
            if ! git log -1 --format='%B' "$commit" | grep -q 'Signed-off-by:'; then
              echo "::error::Commit $commit is missing 'Signed-off-by:' trailer (run: git commit -s)"
              fails=1
            fi
          done < <(git rev-list "$base_sha..$head_sha")
          exit $fails