name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Gradle 8.x + 全量 assembleDebug + CodeQL 抽取/分析，单语言 job 可能逼近 30m；
    # 提到 90m 避免假超时取消（java/kotlin 各跑一次 assembleDebug）。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript, kotlin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 构建环境：Gradle 多模块 Android 工程必须 JDK17 + Gradle 才能构建，
      # 否则 manual build-mode 下的 ./gradlew assembleDebug 跑不起来（原 stock autobuild 即因此每跑必败）。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-

      - name: Create local.properties (CI fallback)
        run: |
          echo "ci.build=true" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"