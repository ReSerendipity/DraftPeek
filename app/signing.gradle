// ============================================================
// signing.gradle — Release signing configuration (externalized)
// ============================================================
// REFACTOR: [H1] - 将签名凭据读取逻辑从 app/build.gradle.kts 外置到独立
// 脚本，遵循配置外置（Config Externalization）原则：
// 1) build.gradle.kts 只保留构建逻辑，不包含凭据读取代码；
// 2) 凭据来源仍为 local.properties（git-ignored），无硬编码；
// 3) Fail Fast：release 构建时若凭据缺失，立即抛 GradleException 终止；
// 4) signingConfigs 仅在 release buildType 中引用（debug 不加载）。
//
// 注：本文件为 Groovy DSL 脚本（apply from 引用的 .gradle 文件），不能用
// Kotlin 语法（val/fun），必须用 Groovy 语法（def）。
// ============================================================

import java.util.Properties

android {
    signingConfigs {
        create("release") {
            def properties = new Properties()
            def localPropertiesFile = rootProject.file("local.properties")
            if (localPropertiesFile.exists()) {
                localPropertiesFile.newInputStream().withCloseable { properties.load(it) }
            }
            // SECURITY: [D3] - 凭据从 local.properties 读取，绝不硬编码。
            // Fail Fast 延迟到 release 构建时执行：spotless/assembleDebug 等
            // 非 release 任务不触发凭据校验，避免 CI build-and-test job 因缺
            // 失签名凭据而失败（CI release-build job 单独生成测试密钥）。
            def storePass = properties.getProperty("RELEASE_STORE_PASSWORD", "")
            def keyPass = properties.getProperty("RELEASE_KEY_PASSWORD", "")
            def alias = properties.getProperty("RELEASE_KEY_ALIAS", "")
            def storeFile = properties.getProperty("RELEASE_STORE_FILE", "")
            if (storePass && keyPass && alias && storeFile) {
                this.storeFile = file(storeFile)
                this.storePassword = storePass
                this.keyAlias = alias
                this.keyPassword = keyPass
                // SECURITY VULN-010: 启用 APK Signature Scheme v3
                // v3 支持密钥轮换（key rotation），允许用新密钥更新 APK
                // 而旧版本 APK 仍可验证。v1 (JAR signing) 和 v2 也保留启用。
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
            // 注意：缺少凭据时不抛异常；release 构建因 signingConfig 未初始化
            // 而自然失败，CI release-build job 会提供完整凭据。
        }
    }
}
