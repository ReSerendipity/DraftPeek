[versions]
# Versions
agp = "8.10.1"
kotlin = "2.4.10"
ksp = "2.2.21-2.0.4"
buildTools = "36.1.0"
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
compose-bom = "2025.04.01"
hilt = "2.58"
hilt-navigation-compose = "1.2.0"
navigation-compose = "2.8.4"
lifecycle = "2.8.7"
core-ktx = "1.15.0"
activity-compose = "1.9.3"
appcompat = "1.7.0"
room = "2.7.1"
datastore = "1.1.1"
collection = "1.4.0"
kotlinx-collections-immutable = "0.3.7"
retrofit = "2.11.0"
okhttp = "4.12.0"
accompanist = "0.36.0"
material3 = "1.3.0"
material3-adaptive = "1.1.0"
coroutines = "1.9.0"
documentfile = "1.0.1"
leakcanary = "2.14"
# markwon removed — replaced by CommonMark native + WebView pipeline
windowmanager = "1.3.0"
# SECURITY: [D5] - 以下三个库版本升级修复已知安全问题（具体 CVE 列表需查阅
# 各库 release notes / security advisories，此处仅记录升级动机与版本基线）：
# - sqlcipher 4.5.3 → 4.5.4：维护版本，更新 SQLite baseline 至 3.41.2。
#   ⚠️ BREAKING CHANGE: 4.5.4 移除了 SQLCipher 自有异常类，改用 android.database.*
#   异常类；android.sqlitex 依赖升级到 2.2.0。需验证 AppDatabase/DAO 层异常捕获
#   代码是否仍能正常工作。另注：android-database-sqlcipher 项目已 deprecated，
#   长期应迁移至 sqlcipher-android（新包名 net.zetetic:sqlcipher-android）。
# - poi-ooxml 5.2.5 → 5.3.0：minor 版本，修复 XMLBeans XXE 与 HWPF 解析 DoS。
# - jgit 6.8.0 → 6.10.1：minor 版本，修复 SSH transport 多项中危问题。
#   版本号 6.10.1.202505221210-r 已在 Maven Central 验证存在。
# 注：实际 CVE 编号需运行 `./gradlew dependencyCheck` 或查阅官方 advisory 校对。
jgit = "6.10.1.202505221210-r"
poi-ooxml = "5.3.0"
sqlcipher = "4.6.0"
# SECURITY VULN-016: security-crypto (1.1.0-alpha06) removed — replaced by self-built
# SecureFileStorage + SecurePreferences (Keystore AES-256-GCM directly).
# Do NOT re-add this alpha dependency.
juniversalchardet = "2.5.0"
sora-editor = "0.24.6"
tree-sitter-binding = "4.3.2"
desugar = "2.1.5"
richeditor-compose = "1.0.0-rc13"
commonmark = "0.24.0"
ktlint = "1.3.1"
timber = "5.0.1"

# Image loading
coil = "2.7.0"

# ===== Mature library replacements (P0+P1) =====
java-diff-utils = "4.12"
lsp4j = "0.22.0"
android-pdf-viewer = "2.0.2"
pf4j = "3.11.0"

# Remote file systems
commons-net = "3.11.1"    # FTP/FTPS client
jsch = "0.2.24"           # SFTP/SSH client (Eclipse maven)

# SECURITY: Google Play Integrity API for device integrity verification (VULN-009)
play-integrity = "1.3.0"

# ===== New feature dependencies (全功能实施指南 v1.0) =====
# CRDT: Yjs collaborative editing (note: simple-yjs may need manual setup)
# Graph: Neo4j OGM (optional enhancement for knowledge graph)
# Cloud sync: AWS S3 + Dropbox SDK
neo4j-ogm = "4.0.4"
aws-s3 = "1.12.658"
dropbox-core = "5.1.0"

# Testing
junit4 = "4.13.2"
junit5 = "5.11.3"
mockk = "1.13.13"
turbine = "1.2.0"
kotlinx-coroutines-test = "1.9.0"
androidx-test-core = "1.6.1"
androidx-test-ext-junit = "1.2.1"
androidx-test-runner = "1.6.2"
androidx-test-rules = "1.6.1"
androidx-test-uiautomator = "2.2.0"
androidx-benchmark = "1.2.0"
robolectric = "4.14.1"
paparazzi = "2.0.0-alpha02"
mockwebserver = "4.12.0"
jacoco = "0.8.12"
json = "20240303"

[libraries]
# AndroidX Core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

# Compose BOM
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
compose-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3-adaptive" }
compose-material3-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "material3-adaptive" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }

# Navigation
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# Lifecycle
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# DataStore
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# ProfileInstaller (Baseline Profiles runtime)
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.3.1" }

# Glance (App Widgets with Compose)
glance-appwidget = { module = "androidx.glance:glance-appwidget", version = "1.1.1" }
glance-material3 = { module = "androidx.glance:glance-material3", version = "1.1.1" }

# Collection (LruCache)
collection = { module = "androidx.collection:collection", version.ref = "collection" }

# Kotlinx Collections Immutable (ImmutableList for @Immutable State)
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }

# Network
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# DocumentFile
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

# JSR-330 dependency-injection annotations (@Inject, @Singleton, etc.)
# Lightweight (no transitive deps) — allows core modules to declare injectable
# constructors without pulling in the full Hilt/Dagger runtime. [B3/DIP]
javax-inject = { module = "javax.inject:javax.inject", version = "1" }

# ===== Mature library replacements (P0+P1) =====
# java-diff-utils: Replace self-implemented Myers diff (P0)
java-diff-utils = { module = "io.github.java-diff-utils:java-diff-utils", version.ref = "java-diff-utils" }
# Eclipse LSP4J: Replace self-implemented LSP protocol layer (P1)
lsp4j = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j", version.ref = "lsp4j" }
# PF4J: Replace skeleton PluginManager (P1)
pf4j = { module = "org.pf4j:pf4j", version.ref = "pf4j" }

# Debug
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
# Logging
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# Coil (image loading with memory/disk caching)
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }

# Window Manager (foldable support)
windowmanager = { module = "androidx.window:window", version.ref = "windowmanager" }

# JGit (pure Java Git implementation)
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }

# Apache POI (Office document parsing)
poi-ooxml = { group = "org.apache.poi", name = "poi-ooxml", version.ref = "poi-ooxml" }
# poi-scratchpad: legacy OLE2 formats (.doc via HWPFDocument, .ppt via HSLFSlideShow)
poi-scratchpad = { group = "org.apache.poi", name = "poi-scratchpad", version.ref = "poi-ooxml" }

# SQLCipher (encrypted Room database) — migrated to sqlcipher-android (new package)
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
# SECURITY VULN-016: security-crypto library removed.
# Replaced by SecureFileStorage + SecurePreferences (self-built Keystore AES-256-GCM).

# juniversalchardet (CJK encoding detection)
juniversalchardet = { module = "com.github.albfernandez:juniversalchardet", version.ref = "juniversalchardet" }

# sora-editor TreeSitter (incremental parsing, pilot: Java)
sora-language-treesitter = { module = "io.github.rosemoe:language-treesitter", version.ref = "sora-editor" }
# sora-editor 核心 + TextMate 语法（feature/editor）
sora-editor = { module = "io.github.rosemoe:editor", version.ref = "sora-editor" }
sora-language-textmate = { module = "io.github.rosemoe:language-textmate", version.ref = "sora-editor" }
tree-sitter = { module = "com.itsaky.androidide.treesitter:android-tree-sitter", version.ref = "tree-sitter-binding" }
tree-sitter-java = { module = "com.itsaky.androidide.treesitter:tree-sitter-java", version.ref = "tree-sitter-binding" }

# Java 8+ API desugaring (required by tree-sitter libraries)
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

# Compose Rich Editor (WYSIWYG Markdown editing, Apache-2.0)
richeditor-compose = { module = "com.mohamedrejeb.richeditor:richeditor-compose", version.ref = "richeditor-compose" }

# Remote file systems
commons-net = { module = "commons-net:commons-net", version.ref = "commons-net" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }

# SECURITY: Google Play Integrity API (VULN-009)
play-integrity = { module = "com.google.android.play:integrity", version.ref = "play-integrity" }

# CommonMark (native Markdown parsing)
commonmark-core = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-autolink = { module = "org.commonmark:commonmark-ext-autolink", version.ref = "commonmark" }
commonmark-tasklist = { module = "org.commonmark:commonmark-ext-task-list-items", version.ref = "commonmark" }

# ===== New feature libraries (全功能实施指南 v1.0) =====
# Neo4j OGM (optional: knowledge graph database backend)
neo4j-ogm-core = { module = "org.neo4j:neo4j-ogm-core", version.ref = "neo4j-ogm" }
# AWS S3 SDK (cloud sync backend)
aws-java-sdk-s3 = { module = "com.amazonaws:aws-java-sdk-s3", version.ref = "aws-s3" }
# Dropbox SDK (cloud sync backend)
dropbox-core-sdk = { module = "com.dropbox.core:dropbox-core-sdk", version.ref = "dropbox-core" }

# junit4：供与 Paparazzi 共处同一 test source set 的纯 Kotlin 单测使用。
# 注意：core:ui 不能加 useJUnitPlatform()，否则 JUnit4 的 Paparazzi 用例会被静默跳过。
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit5-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit5-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines-test" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
androidx-benchmark-common = { module = "androidx.benchmark:benchmark-common", version.ref = "androidx-benchmark" }
androidx-benchmark-junit4 = { module = "androidx.benchmark:benchmark-junit4", version.ref = "androidx-benchmark" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
paparazzi = { module = "app.cash.paparazzi:paparazzi", version.ref = "paparazzi" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
